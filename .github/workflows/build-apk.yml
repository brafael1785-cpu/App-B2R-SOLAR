name: Build B2R Solar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk /tmp/B2R-Solar.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: B2R-Solar-APK
          path: /tmp/B2R-Solar.apk

      - name: Publish Release with B2R-Solar.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: B2R Solar APK
          body: "Instalador Android do aplicativo B2R Solar."
          files: /tmp/B2R-Solar.apk
